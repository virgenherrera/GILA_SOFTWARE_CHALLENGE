services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: ${DB_NAME:-ecommerce}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./resources/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-ecommerce}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-secret-change-in-production-min-32-chars}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./test/fixtures:/app/test-fixtures:ro
    ipc: host
    environment:
      CI: "true"
    depends_on:
      frontend:
        condition: service_healthy
    command: sh -c "corepack enable pnpm && pnpm exec playwright test"
    profiles:
      - test
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
