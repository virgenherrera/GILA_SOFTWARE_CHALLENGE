<section class="flex flex-col gap-4">
  <h2 class="text-xl font-semibold text-surface-900">Import Products from CSV</h2>

  <div class="flex flex-col gap-3 rounded-md border border-surface-200 bg-white p-4">
    <label for="csv-file" class="text-sm font-medium text-surface-700">CSV file</label>
    <input
      id="csv-file"
      #fileInputRef
      type="file"
      accept=".csv"
      class="hidden"
      (change)="onFileSelected($event)"
    />

    <div
      class="drop-zone flex flex-col items-center justify-center gap-2 rounded-md border-2 border-dashed border-surface-300 bg-surface-50 px-6 py-10 text-center transition-colors hover:border-brand-400 hover:bg-brand-50"
      [class.drop-zone--active]="dragActive()"
      role="button"
      tabindex="0"
      (click)="onDropZoneClick()"
      (keydown.enter)="onDropZoneClick()"
      (keydown.space)="onDropZoneClick()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <svg
        class="h-10 w-10 text-surface-400"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"
        />
      </svg>
      <p class="text-sm font-medium text-surface-700">Click to select a CSV file</p>
      <p class="text-xs text-surface-500">or drag and drop</p>
    </div>

    @if (selectedFile(); as file) {
      <p class="text-sm text-surface-500">Selected: {{ file.name }}</p>
    }

    @if (error()) {
      <p
        class="rounded-md border border-danger-300 bg-danger-50 px-4 py-3 text-sm text-danger-700"
        role="alert"
      >
        {{ error() }}
      </p>
    }

    <div>
      <button
        type="button"
        class="rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="!selectedFile() || uploading()"
        (click)="onUpload()"
      >
        {{ uploading() ? 'Uploading…' : 'Upload' }}
      </button>
    </div>
  </div>
</section>
