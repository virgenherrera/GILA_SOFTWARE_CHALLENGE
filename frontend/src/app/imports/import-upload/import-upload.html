<section class="flex flex-col gap-4">
  <h2 class="text-xl font-semibold text-gray-900">Import Products from CSV</h2>

  <div class="flex flex-col gap-3 rounded-md border border-gray-200 bg-white p-4">
    <label for="csv-file" class="text-sm font-medium text-gray-700">CSV file</label>
    <input
      id="csv-file"
      type="file"
      accept=".csv"
      class="text-sm text-gray-700"
      (change)="onFileSelected($event)"
    />

    @if (selectedFile(); as file) {
      <p class="text-sm text-gray-500">Selected: {{ file.name }}</p>
    }

    @if (error()) {
      <p
        class="rounded-md border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-700"
        role="alert"
      >
        {{ error() }}
      </p>
    }

    <div>
      <button
        type="button"
        class="rounded-md bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="!selectedFile() || uploading()"
        (click)="onUpload()"
      >
        {{ uploading() ? 'Uploading…' : 'Upload' }}
      </button>
    </div>
  </div>
</section>
