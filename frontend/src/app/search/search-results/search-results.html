@if (products().length === 0) {
  <p class="py-8 text-center text-sm text-surface-500">No products found</p>
} @else {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (product of products(); track product.sku) {
      <div class="flex flex-col gap-2">
        <app-product-card [product]="product" (view)="onView($event)" />
        <button
          type="button"
          class="rounded-md border border-brand-300 px-2 py-2.5 text-sm font-medium text-brand-700 hover:bg-brand-50 sm:py-1.5"
          (click)="onAddToCart(product.sku)"
        >
          Add to Cart
        </button>
      </div>
    }
  </div>
}
