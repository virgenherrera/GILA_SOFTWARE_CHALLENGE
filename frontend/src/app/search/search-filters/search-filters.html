<div class="flex flex-col gap-3 rounded-lg border border-surface-200 bg-white p-4 shadow-sm">
  <div class="flex flex-col gap-3 sm:flex-wrap sm:flex-row">
    <label for="keyword" class="sr-only">Search</label>
    <input
      id="keyword"
      type="search"
      placeholder="Search by name, description, or SKU…"
      class="min-w-[220px] flex-1 rounded-md border border-surface-300 px-3 py-2 text-sm"
      [value]="keyword()"
      (input)="onKeywordInput($any($event.target).value)"
    />

    <label for="category" class="sr-only">Category</label>
    <select
      id="category"
      class="rounded-md border border-surface-300 px-3 py-2 text-sm"
      [value]="category()"
      (change)="onCategoryChange($any($event.target).value)"
    >
      <option value="">All categories</option>
      @for (categoryOption of categories(); track categoryOption) {
        <option [value]="categoryOption">{{ categoryOption }}</option>
      }
    </select>
  </div>

  <div class="flex flex-wrap items-start gap-3">
    <div class="flex items-center gap-2">
      <span class="text-sm text-surface-600" aria-hidden="true">Price</span>
      <label for="price-min" class="sr-only">Minimum price</label>
      <input
        id="price-min"
        type="number"
        placeholder="Min"
        class="w-24 rounded-md border border-surface-300 px-3 py-2 text-sm"
        (input)="onPriceMinInput($any($event.target).value)"
      />
      <span class="text-sm text-surface-400">to</span>
      <label for="price-max" class="sr-only">Maximum price</label>
      <input
        id="price-max"
        type="number"
        placeholder="Max"
        class="w-24 rounded-md border border-surface-300 px-3 py-2 text-sm"
        (input)="onPriceMaxInput($any($event.target).value)"
      />
    </div>

    <label for="sort-by" class="sr-only">Sort by</label>
    <select
      id="sort-by"
      class="rounded-md border border-surface-300 px-3 py-2 text-sm"
      [value]="sortBy()"
      (change)="onSortByChange($any($event.target).value)"
    >
      @for (field of sortFields; track field) {
        <option [value]="field">Sort: {{ field }}</option>
      }
    </select>

    <button
      id="sort-order-toggle"
      type="button"
      class="rounded-md border border-surface-300 px-3 py-2 text-sm font-medium text-surface-700 hover:bg-surface-50"
      (click)="onToggleSortOrder()"
    >
      {{ sortOrder() === 'asc' ? 'Ascending ↑' : 'Descending ↓' }}
    </button>
  </div>

  @if (priceRangeInvalid()) {
    <p class="text-sm text-danger-600" role="alert">
      Minimum price must not be greater than maximum price.
    </p>
  }
</div>
