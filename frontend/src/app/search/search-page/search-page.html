<section class="flex flex-col gap-4">
  <h2 class="text-xl font-semibold text-surface-900">Search Products</h2>

  <app-search-filters
    [categories]="categories()"
    (keywordChange)="onKeywordChange($event)"
    (filtersChange)="onFiltersChange($event)"
  />

  <div aria-live="polite" class="sr-only">{{ resultCountMessage() }}</div>

  @if (cartMessage(); as message) {
    <p class="rounded-md border border-success-300 bg-success-50 px-4 py-3 text-sm text-success-700">
      {{ message }}
    </p>
  }

  @if (loading()) {
    <p class="py-8 text-center text-sm text-surface-500" role="status">Loading products…</p>
  } @else if (error()) {
    <p
      class="rounded-md border border-danger-300 bg-danger-50 px-4 py-3 text-sm text-danger-700"
      role="alert"
    >
      {{ error() }}
    </p>
  } @else {
    <app-search-results
      [products]="products()"
      (view)="onView($event)"
      (addToCart)="onAddToCart($event)"
    />

    @if (paging(); as currentPaging) {
      <div class="flex items-center justify-between pt-2">
        <span class="text-sm text-surface-500">
          Page {{ currentPaging.page }} · {{ currentPaging.total }} total products
        </span>
        <div class="flex gap-2">
          <button
            type="button"
            class="rounded-md border border-surface-300 px-3 py-1.5 text-sm font-medium text-surface-700 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="!currentPaging.prev"
            (click)="onPrevPage()"
          >
            Previous
          </button>
          <button
            type="button"
            class="rounded-md border border-surface-300 px-3 py-1.5 text-sm font-medium text-surface-700 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="!currentPaging.next"
            (click)="onNextPage()"
          >
            Next
          </button>
        </div>
      </div>
    }
  }
</section>
