<header class="border-b border-gray-200 bg-white">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
    <h1 class="text-xl font-semibold text-gray-900">{{ title() }}</h1>
    <div class="flex items-center gap-4">
      <a routerLink="/products" class="text-sm font-medium text-blue-600 hover:text-blue-800"
        >Products</a
      >
      <a routerLink="/search" class="text-sm font-medium text-blue-600 hover:text-blue-800"
        >Search</a
      >
      <a routerLink="/imports" class="text-sm font-medium text-blue-600 hover:text-blue-800"
        >Imports</a
      >
      <a routerLink="/cart" class="relative text-sm font-medium text-blue-600 hover:text-blue-800">
        Cart
        @if (cartItemCount() > 0) {
          <span
            class="absolute -right-3 -top-2 inline-flex h-4 min-w-4 items-center justify-center rounded-full bg-red-600 px-1 text-[10px] font-semibold text-white"
          >
            {{ cartItemCount() }}
          </span>
        }
      </a>
    </div>
  </nav>
</header>

<main class="mx-auto max-w-6xl px-4 py-6">
  <router-outlet />
</main>
