<article
  class="flex flex-col gap-2 rounded-lg border border-surface-200 bg-white p-4 shadow-sm transition hover:shadow-md"
>
  <div class="flex items-start justify-between gap-2">
    <span class="font-mono text-xs text-surface-500">{{ product().sku }}</span>
    @if (isOutOfStock()) {
      <span class="rounded-full bg-danger-100 px-2 py-0.5 text-xs font-medium text-danger-700"
        >Out of stock</span
      >
    }
  </div>

  <h3 class="text-base font-semibold text-surface-900">{{ product().name }}</h3>
  <p class="text-sm text-surface-500">{{ product().category }}</p>

  <div class="mt-1 flex items-baseline justify-between">
    <span class="text-lg font-bold text-surface-900">${{ formattedPrice() }}</span>
    <span class="text-sm text-surface-600">Stock: {{ product().stock }}</span>
  </div>

  <div class="mt-3 flex gap-2">
    <button
      type="button"
      class="flex-1 rounded-md border border-surface-300 px-2 py-2.5 sm:py-1.5 text-sm font-medium text-surface-700 hover:bg-surface-50"
      [attr.aria-label]="'View ' + product().name"
      (click)="onView()"
    >
      View
    </button>
    <button
      type="button"
      class="flex-1 rounded-md border border-brand-300 px-2 py-2.5 sm:py-1.5 text-sm font-medium text-brand-700 hover:bg-brand-50"
      [attr.aria-label]="'Edit ' + product().name"
      (click)="onEdit()"
    >
      Edit
    </button>
    <button
      type="button"
      class="flex-1 rounded-md border border-danger-300 px-2 py-2.5 sm:py-1.5 text-sm font-medium text-danger-700 hover:bg-danger-50"
      [attr.aria-label]="'Delete ' + product().name"
      (click)="onDelete()"
    >
      Delete
    </button>
  </div>
</article>
