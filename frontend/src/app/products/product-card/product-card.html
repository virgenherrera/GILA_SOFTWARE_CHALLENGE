<article
  class="flex flex-col gap-2 rounded-lg border border-gray-200 bg-white p-4 shadow-sm transition hover:shadow-md"
>
  <div class="flex items-start justify-between gap-2">
    <span class="font-mono text-xs text-gray-500">{{ product().sku }}</span>
    @if (isOutOfStock()) {
      <span class="rounded-full bg-red-100 px-2 py-0.5 text-xs font-medium text-red-700"
        >Out of stock</span
      >
    }
  </div>

  <h3 class="text-base font-semibold text-gray-900">{{ product().name }}</h3>
  <p class="text-sm text-gray-500">{{ product().category }}</p>

  <div class="mt-1 flex items-baseline justify-between">
    <span class="text-lg font-bold text-gray-900">${{ formattedPrice() }}</span>
    <span class="text-sm text-gray-600">Stock: {{ product().stock }}</span>
  </div>

  <div class="mt-3 flex gap-2">
    <button
      type="button"
      class="flex-1 rounded-md border border-gray-300 px-2 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50"
      (click)="onView()"
    >
      View
    </button>
    <button
      type="button"
      class="flex-1 rounded-md border border-blue-300 px-2 py-1.5 text-sm font-medium text-blue-700 hover:bg-blue-50"
      (click)="onEdit()"
    >
      Edit
    </button>
    <button
      type="button"
      class="flex-1 rounded-md border border-red-300 px-2 py-1.5 text-sm font-medium text-red-700 hover:bg-red-50"
      (click)="onDelete()"
    >
      Delete
    </button>
  </div>
</article>
